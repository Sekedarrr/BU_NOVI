<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persegi</title>
</head>
<body>
    <h1>HTML5 Canvas - fillStyle</h1>
    <canvas id="Descan" width="200" height="125" style="border: 1px solid #000000;">
        </canvas>
        <script>
            const canvas = document.getElementById("Descan");
            const ctx = canvas.getContext("2d");

            ctx.fillStyle = "green";
            ctx.fillRect(10, 10, 100, 100);
            </script>
</body>
</html>
