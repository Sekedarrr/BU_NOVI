<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat segitiga</title>
</head>
<body>
    <h1>HTML5 Canvas - fillStyle</h1>
    <canvas id="Descan" width="640" height="480" style="border: 1px solid #000000;">
        </canvas>
        <script>
            const canvas = document.getElementById("Descan");
            const ctx = canvas.getContext("2d");

            ctx.beginPath();
            ctx.arc(300, 200, 40, 0, 2 * Math.PI);
            ctx.stroke();
            linewidth = 5;

            </script>
</body>
</html>
